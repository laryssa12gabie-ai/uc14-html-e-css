 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe</title>
    <link rel="stylesheet" href="seção de usuários.css">
</head>

<body>

    <section class="usuarios">

        <h1>Nossa Equipe</h1>

        <div class="container">

            <div class="card">
                <img src="https://i.pinimg.com/736x/e9/dc/70/e9dc7005a2c5c6f8444242447f336fa5.jpg">
                <h2>Ana Silva</h2>
                <h3>Desenvolvedora</h3>
                <p>Cria soluções e sistemas para a empresa.</p>
                <button>Ver Perfil</button>
            </div>

            <div class="card">
                <img src="https://i.pinimg.com/736x/8a/8e/5e/8a8e5e8e15bd6567770a8914aaf61b72.jpg" alt="Usuário">
                <h2>Lucas Santos</h2>
                <h3>Designer</h3>
                <p>Responsável pela parte visual dos projetos.</p>
                <button>Ver Perfil</button>
            </div>

            <div class="card">
                <img src="https://i.pinimg.com/1200x/30/ca/0e/30ca0e3f8baf42a4b3fb039a20c5f745.jpg" alt="Usuário">
                <h2>Mariana Costa</h2>
                <h3>Analista</h3>
                <p>Analisa dados e melhora processos.</p>
                <button>Ver Perfil</button>
            </div>

            <div class="card">
                <img src="https://i.pinimg.com/1200x/e4/3e/aa/e43eaacaef0b8819834a372f2725c5e9.jpg" alt="Usuário">
                <h2>Pedro Oliveira</h2>
                <h3>Gerente</h3>
                <p>Coordena a equipe e os projetos.</p>
                <button>Ver Perfil</button>
            </div>

        </div>

    </section>

</body>
</html>
